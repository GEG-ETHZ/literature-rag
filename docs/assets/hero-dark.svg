<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" width="1600" height="930" role="img" aria-labelledby="ht hd">
  <title id="ht">Every answer comes from a paper the group uploaded, or there is no answer</title>
  <desc id="hd">On the left, what people do: upload a published paper with geg-rag-upload, and ask a question. Uploading: the uploader finds the DOI, confirmed at doi.org or Crossref, names the file by it and skips copies; the bucket stores one PDF per DOI with the citation in its metadata; a Cloud Function imports it into the Vertex AI RAG corpus. Asking: the agent searches only the corpus, a callback abstains when the answer is not backed by the retrieved chunks, and rendering adds author, year, title, DOI and the excerpts. On the right, what you get: a shared library, an answer with sources, or a fixed sentence when no paper covers the question.</desc>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F6F6B"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5CC08A"/></marker></defs>
  <rect width="1600" height="930" fill="#0E0E10"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="56" y="70" font-size="12" font-weight="700" fill="#5CC08A" letter-spacing="1.6">LITERATURE RAG  ·  GEG GROUP</text>
    <text x="56" y="124" font-size="36" font-weight="800" fill="#EDEDEA" letter-spacing="-0.8">Every answer comes from a paper the group uploaded, or there is no answer.</text>
    <text x="56" y="166" font-size="18" font-weight="400" fill="#A3A39D">Upload a published PDF once: it is named by its DOI and imported into the corpus.</text>
    <text x="56" y="192" font-size="18" font-weight="400" fill="#A3A39D">The agent answers only from that corpus and cites author, year, title and DOI.</text>
    <text x="56" y="250" font-size="12" font-weight="700" fill="#EDEDEA" letter-spacing="2">WHAT PEOPLE DO</text><rect x="56" y="262" width="260" height="1.5" fill="#EDEDEA"/><text x="380" y="250" font-size="12" font-weight="700" fill="#EDEDEA" letter-spacing="2">HOW A PAPER BECOMES AN ANSWER</text><rect x="380" y="262" width="770" height="1.5" fill="#EDEDEA"/><text x="1214" y="250" font-size="12" font-weight="700" fill="#EDEDEA" letter-spacing="2">WHAT YOU GET</text><rect x="1214" y="262" width="330" height="1.5" fill="#EDEDEA"/>
    <path d="M 316 440 L 376 440" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 316 710 L 376 710" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 495 350 L 495 386" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 610 440 L 646 440" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 880 440 L 916 440" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 1150 440 L 1210 440" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 1035 490 L 1035 536" fill="none" stroke="#5CC08A" stroke-width="2.2" marker-end="url(#a)"/><path d="M 495 616 L 495 656" fill="none" stroke="#5CC08A" stroke-width="2.2" marker-end="url(#a)"/><path d="M 610 710 L 646 710" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 880 710 L 916 710" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 1150 710 L 1182 710 L 1182 652 L 1210 652" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/><path d="M 765 760 L 765 790 L 1210 790" fill="none" stroke="#6F6F6B" stroke-width="1.6" marker-end="url(#r)"/>
    <rect x="380" y="540" width="770" height="76" rx="8" fill="#12261B" stroke="#5CC08A" stroke-width="1.6"/><text x="640" y="570" font-size="11" font-weight="700" fill="#5CC08A" letter-spacing="1.6">VERTEX AI RAG CORPUS</text><text x="640" y="595" font-size="17" font-weight="700" fill="#EDEDEA">Every uploaded paper. The only thing the agent reads.</text>
    <rect x="380" y="290" width="230" height="60" rx="8" fill="#1C1C20" stroke="#6F6F6B" stroke-dasharray="5 4"/><text x="398" y="316" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">LOOKED UP</text><text x="398" y="340" font-size="19" font-weight="700" fill="#EDEDEA">doi.org, Crossref</text><rect x="56" y="390" width="260" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="56" y="390" width="4" height="100" fill="#EDEDEA"/><text x="74" y="416" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">YOU</text><text x="74" y="440" font-size="19" font-weight="700" fill="#EDEDEA">Upload a paper</text><text x="74" y="464" font-size="14" font-weight="400" fill="#A3A39D">geg-rag-upload; published</text><text x="74" y="483" font-size="14" font-weight="400" fill="#A3A39D">versions only</text><rect x="56" y="660" width="260" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="56" y="660" width="4" height="100" fill="#EDEDEA"/><text x="74" y="686" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">YOU</text><text x="74" y="710" font-size="19" font-weight="700" fill="#EDEDEA">Ask a question</text><text x="74" y="734" font-size="14" font-weight="400" fill="#A3A39D">In the playground or just</text><text x="74" y="753" font-size="14" font-weight="400" fill="#A3A39D">agent-query</text><rect x="380" y="390" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="380" y="390" width="4" height="100" fill="#6F6F6B"/><text x="398" y="416" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">01  UPLOADER</text><text x="398" y="440" font-size="19" font-weight="700" fill="#EDEDEA">Name</text><text x="398" y="464" font-size="14" font-weight="400" fill="#A3A39D">Finds the DOI, names the</text><text x="398" y="483" font-size="14" font-weight="400" fill="#A3A39D">file, skips copies</text><rect x="650" y="390" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="650" y="390" width="4" height="100" fill="#6F6F6B"/><text x="668" y="416" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">02  BUCKET</text><text x="668" y="440" font-size="19" font-weight="700" fill="#EDEDEA">Store</text><text x="668" y="464" font-size="14" font-weight="400" fill="#A3A39D">One PDF per DOI, citation</text><text x="668" y="483" font-size="14" font-weight="400" fill="#A3A39D">in its metadata</text><rect x="920" y="390" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="920" y="390" width="4" height="100" fill="#6F6F6B"/><text x="938" y="416" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">03  CLOUD FUNCTION</text><text x="938" y="440" font-size="19" font-weight="700" fill="#EDEDEA">Import</text><text x="938" y="464" font-size="14" font-weight="400" fill="#A3A39D">Into the corpus on every</text><text x="938" y="483" font-size="14" font-weight="400" fill="#A3A39D">upload</text><rect x="380" y="660" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="380" y="660" width="4" height="100" fill="#6F6F6B"/><text x="398" y="686" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">04  AGENT</text><text x="398" y="710" font-size="19" font-weight="700" fill="#EDEDEA">Retrieve</text><text x="398" y="734" font-size="14" font-weight="400" fill="#A3A39D">Searches the corpus,</text><text x="398" y="753" font-size="14" font-weight="400" fill="#A3A39D">nothing else</text><rect x="650" y="660" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="650" y="660" width="4" height="100" fill="#6F6F6B"/><text x="668" y="686" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">05  CALLBACK</text><text x="668" y="710" font-size="19" font-weight="700" fill="#EDEDEA">Check</text><text x="668" y="734" font-size="14" font-weight="400" fill="#A3A39D">Not backed by the chunks:</text><text x="668" y="753" font-size="14" font-weight="400" fill="#A3A39D">abstain</text><rect x="920" y="660" width="230" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="920" y="660" width="4" height="100" fill="#6F6F6B"/><text x="938" y="686" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">06  RENDERING</text><text x="938" y="710" font-size="19" font-weight="700" fill="#EDEDEA">Cite</text><text x="938" y="734" font-size="14" font-weight="400" fill="#A3A39D">Author, year, title, DOI,</text><text x="938" y="753" font-size="14" font-weight="400" fill="#A3A39D">excerpts</text><rect x="1214" y="390" width="330" height="100" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="1214" y="390" width="4" height="100" fill="#5CC08A"/><text x="1232" y="416" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">OUTPUT</text><text x="1232" y="440" font-size="19" font-weight="700" fill="#EDEDEA">A shared library</text><text x="1232" y="464" font-size="14" font-weight="400" fill="#A3A39D">Flat, deduplicated, one name per DOI</text><rect x="1214" y="610" width="330" height="84" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="1214" y="610" width="4" height="84" fill="#5CC08A"/><text x="1232" y="636" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">OUTPUT</text><text x="1232" y="660" font-size="19" font-weight="700" fill="#EDEDEA">An answer with sources</text><text x="1232" y="684" font-size="14" font-weight="400" fill="#A3A39D">Cited, with the excerpts it rests on</text><rect x="1214" y="726" width="330" height="84" rx="8" fill="#1C1C20" stroke="#2A2A2E"/><rect x="1214" y="726" width="4" height="84" fill="#5CC08A"/><text x="1232" y="752" font-size="11" font-weight="600" fill="#A3A39D" letter-spacing="1.6">OR</text><text x="1232" y="776" font-size="19" font-weight="700" fill="#EDEDEA">A fixed sentence</text><text x="1232" y="800" font-size="14" font-weight="400" fill="#A3A39D">No paper on it, no answer</text>
    <rect x="56" y="830" width="1488" height="1" fill="#2A2A2E"/><rect x="56" y="847" width="4" height="18" fill="#EDEDEA"/><text x="70" y="860" font-size="14" font-weight="400" fill="#A3A39D">You: the only manual steps</text><rect x="326" y="847" width="4" height="18" fill="#6F6F6B"/><text x="340" y="860" font-size="14" font-weight="400" fill="#A3A39D">Code in this repository</text><rect x="616" y="847" width="18" height="18" rx="3" fill="none" stroke="#6F6F6B" stroke-dasharray="4 3"/><text x="644" y="860" font-size="14" font-weight="400" fill="#A3A39D">Outside: looked up, not stored</text><text x="56" y="892" font-size="14" font-weight="400" fill="#A3A39D">Note: the agent never falls back to general knowledge. No paper, no answer.</text>
  </g>
</svg>
